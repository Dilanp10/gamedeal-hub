services:
  - type: web
    name: gamedeal-hub
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: RAWG_API_KEY
        sync: false
      - key: RAWG_BASE_URL
        value: https://api.rawg.io/api
      - key: CHEAPSHARK_BASE_URL
        value: https://www.cheapshark.com/api/1.0
      - key: UPSTREAM_TIMEOUT_MS
        value: 5000
      - key: LOG_LEVEL
        value: info
    healthCheckPath: /docs
